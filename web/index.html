<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanime Downloader - 任务管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-group small {
            display: block;
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .task-list {
            margin-top: 20px;
        }

        .task-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .task-item.completed {
            border-left-color: #28a745;
        }

        .task-item.failed {
            border-left-color: #dc3545;
        }

        .task-item.pending {
            border-left-color: #ffc107;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .task-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .task-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .task-type.single {
            background: #e3f2fd;
            color: #1976d2;
        }

        .task-type.list {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .task-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .task-status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .task-status.downloading {
            background: #cce5ff;
            color: #004085;
        }

        .task-status.completed {
            background: #d4edda;
            color: #155724;
        }

        .task-status.failed {
            background: #f8d7da;
            color: #721c24;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .task-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .task-info-item {
            background: white;
            padding: 10px 15px;
            border-radius: 6px;
        }

        .task-info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .task-info-value {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: rotate(180deg);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .downloading .progress-fill {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Hanime Downloader</h1>
            <p>视频下载任务管理面板</p>
        </div>

        <!-- 统计卡片 -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">总任务数</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);">
                <div class="stat-number" id="stat-pending">0</div>
                <div class="stat-label">待处理</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);">
                <div class="stat-number" id="stat-downloading">0</div>
                <div class="stat-label">下载中</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);">
                <div class="stat-number" id="stat-completed">0</div>
                <div class="stat-label">已完成</div>
            </div>
        </div>

        <!-- 添加任务卡片 -->
        <div class="card">
            <h2>➕ 添加新任务</h2>
            
            <div class="tabs">
                <button class="tab active" data-tab="single">单个视频</button>
                <button class="tab" data-tab="list">播放列表</button>
            </div>

            <div id="alert-container"></div>

            <!-- 单个视频表单 -->
            <div class="tab-content active" id="tab-single">
                <form id="single-form">
                    <div class="form-group">
                        <label for="single-video-id">视频 ID *</label>
                        <input type="text" id="single-video-id" name="video_id" required 
                               placeholder="例如：123456">
                        <small>输入视频的 ID 或 URL 中的 ID 部分</small>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">添加单个任务</button>
                        <button type="reset" class="btn btn-secondary">重置</button>
                    </div>
                </form>
            </div>

            <!-- 播放列表表单 -->
            <div class="tab-content" id="tab-list">
                <form id="list-form">
                    <div class="form-group">
                        <label for="list-id">播放列表 ID *</label>
                        <input type="text" id="list-id" name="list_id" required 
                               placeholder="例如：playlist-123">
                        <small>输入播放列表的 ID</small>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">添加播放列表任务</button>
                        <button type="reset" class="btn btn-secondary">重置</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 任务列表卡片 -->
        <div class="card">
            <h2>📋 任务列表</h2>
            <div id="task-list" class="task-list">
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    <p>暂无任务，请在上方添加新任务</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 刷新按钮 -->
    <button class="refresh-btn" onclick="refreshTasks()" title="刷新任务列表">
        🔄
    </button>

    <script>
        // API 基础地址
        const API_BASE = '';

        // 切换标签页
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
            });
        });

        // 显示提示消息
        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.innerHTML = '';
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        // 添加单个视频任务
        document.getElementById('single-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const videoId = document.getElementById('single-video-id').value.trim();
            
            if (!videoId) {
                showAlert('请输入视频 ID', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        video_id: videoId,
                        type: 'single'
                    })
                });

                if (response.ok) {
                    const task = await response.json();
                    showAlert(`任务已添加：${task.id}`);
                    document.getElementById('single-form').reset();
                    refreshTasks();
                } else {
                    const error = await response.json();
                    showAlert(error.message || '添加任务失败', 'error');
                }
            } catch (error) {
                showAlert(`请求失败：${error.message}`, 'error');
            }
        });

        // 添加播放列表任务
        document.getElementById('list-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const listId = document.getElementById('list-id').value.trim();
            
            if (!listId) {
                showAlert('请输入播放列表 ID', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        list_id: listId,
                        video_id: listId,
                        type: 'list'
                    })
                });

                if (response.ok) {
                    const task = await response.json();
                    showAlert(`播放列表任务已添加：${task.id}`);
                    document.getElementById('list-form').reset();
                    refreshTasks();
                } else {
                    const error = await response.json();
                    showAlert(error.message || '添加任务失败', 'error');
                }
            } catch (error) {
                showAlert(`请求失败：${error.message}`, 'error');
            }
        });

        // 刷新任务列表
        async function refreshTasks() {
            try {
                const response = await fetch(`${API_BASE}/api/tasks`);
                if (!response.ok) throw new Error('Failed to fetch tasks');
                
                const tasks = await response.json();
                renderTasks(tasks);
                updateStats(tasks);
            } catch (error) {
                console.error('Failed to refresh tasks:', error);
            }
        }

        // 渲染任务列表
        function renderTasks(tasks) {
            const container = document.getElementById('task-list');
            
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                        <p>暂无任务，请在上方添加新任务</p>
                    </div>
                `;
                return;
            }

            // 按创建时间倒序排序
            tasks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            container.innerHTML = tasks.map(task => {
                const progress = task.progress || 0;
                const statusClass = task.status;
                const typeClass = task.type;
                
                return `
                    <div class="task-item ${statusClass} ${statusClass === 'downloading' ? 'downloading' : ''}">
                        <div class="task-header">
                            <div>
                                <span class="task-type ${typeClass}">${task.type === 'single' ? '单个视频' : '播放列表'}</span>
                                <span class="task-status ${statusClass}">${getStatusText(task.status)}</span>
                            </div>
                            <div class="task-title">${task.title || task.video_id || task.list_id}</div>
                        </div>
                        
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%">${progress}%</div>
                        </div>
                        
                        <div class="task-info">
                            <div class="task-info-item">
                                <div class="task-info-label">任务 ID</div>
                                <div class="task-info-value" style="font-size: 12px;">${task.id}</div>
                            </div>
                            ${task.video_id ? `
                            <div class="task-info-item">
                                <div class="task-info-label">视频 ID</div>
                                <div class="task-info-value">${task.video_id}</div>
                            </div>
                            ` : ''}
                            ${task.list_id ? `
                            <div class="task-info-item">
                                <div class="task-info-label">播放列表 ID</div>
                                <div class="task-info-value">${task.list_id}</div>
                            </div>
                            ` : ''}
                            <div class="task-info-item">
                                <div class="task-info-label">创建时间</div>
                                <div class="task-info-value">${formatDate(task.created_at)}</div>
                            </div>
                            ${task.completed_at ? `
                            <div class="task-info-item">
                                <div class="task-info-label">完成时间</div>
                                <div class="task-info-value">${formatDate(task.completed_at)}</div>
                            </div>
                            ` : ''}
                            ${task.downloaded ? `
                            <div class="task-info-item">
                                <div class="task-info-label">已下载</div>
                                <div class="task-info-value">${formatBytes(task.downloaded)}</div>
                            </div>
                            ` : ''}
                            ${task.total_size ? `
                            <div class="task-info-item">
                                <div class="task-info-label">总大小</div>
                                <div class="task-info-value">${formatBytes(task.total_size)}</div>
                            </div>
                            ` : ''}
                        </div>
                        
                        ${task.error_message ? `
                        <div class="alert alert-error" style="margin-top: 15px;">
                            ❌ ${task.error_message}
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // 更新统计
        function updateStats(tasks) {
            document.getElementById('stat-total').textContent = tasks.length;
            document.getElementById('stat-pending').textContent = tasks.filter(t => t.status === 'pending').length;
            document.getElementById('stat-downloading').textContent = tasks.filter(t => t.status === 'downloading').length;
            document.getElementById('stat-completed').textContent = tasks.filter(t => t.status === 'completed').length;
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'pending': '待处理',
                'downloading': '下载中',
                'completed': '已完成',
                'failed': '失败'
            };
            return statusMap[status] || status;
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 格式化字节大小
        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 自动刷新（每 5 秒）
        let autoRefreshInterval = setInterval(refreshTasks, 5000);

        // 页面加载时刷新
        refreshTasks();

        // 点击刷新按钮时停止自动刷新，30 秒后恢复
        let autoRefreshPaused = false;
        document.querySelector('.refresh-btn').addEventListener('click', () => {
            if (!autoRefreshPaused) {
                clearInterval(autoRefreshInterval);
                autoRefreshPaused = true;
                setTimeout(() => {
                    autoRefreshInterval = setInterval(refreshTasks, 5000);
                    autoRefreshPaused = false;
                }, 30000);
            }
        });
    </script>
</body>
</html>
